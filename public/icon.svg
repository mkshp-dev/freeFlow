<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="ff-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="ff-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Squircle rounded background -->
  <rect width="64" height="64" rx="16" fill="url(#ff-bg)" />
  
  <!-- Subtle border highlight -->
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5" />

  <!-- Dynamic Loop Arrows / Habit Recreation Flow Symbol -->
  <g filter="url(#shadow)">
    <!-- Upper loop path -->
    <path d="M 19 25 C 19 17 29 17 33.5 22.5 L 35 24.5 C 39 29.5, 47 29.5, 47 22" 
          stroke="url(#ff-glow)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Upper arrow head -->
    <polyline points="41,16 48,22 41,27" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Lower loop path -->
    <path d="M 45 39 C 45 47 35 47 30.5 41.5 L 29 39.5 C 25 34.5, 17 34.5, 17 42" 
          stroke="url(#ff-glow)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Lower arrow head -->
    <polyline points="23,48 16,42 23,37" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Central Habit Spark dot -->
    <circle cx="32" cy="32" r="3.5" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5" />
  </g>
</svg>
